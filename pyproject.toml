[project]
name = "apply"
version = "0.1.0"
description = "Local-first job application pipeline: finds postings, has Claude write and audit the letter, and stops at the submit button."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # Claude writes and audits every letter, so this is not optional.
    "anthropic>=1.7",
]

[project.urls]
Repository = "https://github.com/ajaiupadhyaya/apply"

[project.scripts]
apply = "apply.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apply"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
