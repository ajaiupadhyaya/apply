# The employer registry: which firms to poll, and how to reach their job board.
#
# Copy this to data/employers.yaml (gitignored) and replace these with the firms
# you are targeting. The entries below are illustrative — one working example of
# each supported job board, verified to answer — not recommendations.
#
# The fast way to add a firm:
#     apply resolve <the firm's careers page> --name "Firm" --priority 2
# which reads the page, identifies the board, confirms it answers, and prints
# the block to paste here.
#
#   ats: greenhouse | lever | ashby   -> needs `board` (the slug in their careers URL)
#   ats: workday                      -> needs `host`, `tenant`, `site`
#   ats: oracle                       -> needs `host`, `site`; optional `location_id`
#   ats: nextdata                     -> needs `url`, `lists`
#
# `search` applies to Workday and Oracle. Workday has no "list everything" mode
# worth using, so give it the terms you care about. Oracle does: leave `search`
# out and it reads the whole board, 200 postings a request, up to `max_results`.
# `location_id` is the id of one of its location filters (a country, say); find
# it in the `locationsFacet` of any search response.
#
# `aliases` lists other spellings — what LinkedIn or Handshake call the firm.
# Punctuation, case and suffixes like "Inc." are already ignored, so "J.P.
# Morgan" finds "JPMorgan" on its own; aliases are for real differences. A
# matched alert posting takes the firm's priority and collapses with the copy
# from the firm's own board.
#
# `senior_grades` lists words that mean a senior grade at this firm only — a
# bank's "Associate" is post-MBA, a fund's often is not. Titles containing one
# are rejected for this firm and no other. After changing it, `apply rescore`.

employers:
  - name: Airbnb
    ats: greenhouse
    board: airbnb
    tracks: [corporate]
    priority: 3

  - name: Palantir
    ats: lever
    board: palantir
    tracks: [corporate]
    priority: 3

  - name: Notion
    ats: ashby
    board: notion
    tracks: [corporate]
    priority: 3

  - name: NVIDIA
    aliases: ["NVIDIA Corporation"]
    ats: workday
    host: nvidia.wd5.myworkdayjobs.com
    tenant: nvidia
    site: NVIDIAExternalCareerSite
    search: ["analyst", "intern"]
    max_results: 120
    tracks: [corporate]
    priority: 3

  - name: Oracle
    ats: oracle
    host: eeho.fa.us2.oraclecloud.com
    site: CX_45001
    search: ["analyst", "intern"]
    max_results: 400
    tracks: [corporate]
    priority: 3

  # A careers page with no board API, which renders from the JSON it embeds as
  # __NEXT_DATA__. The record shape is one firm's, so this is a template rather
  # than a working example — check the firm's robots.txt allows the page first.
  # A list whose name contains "internal" is never read.
  #
  # - name: Example Capital
  #   ats: nextdata
  #   url: https://www.example.com/careers
  #   lists: [regularJobs, internships]
  #   tracks: [quant]
  #   priority: 2
