# ---------------------------------------------------------------------------
# Letter content. This is the voice of every generated letter, and it lives
# here rather than in code so it can be rewritten without a commit to src/.
#
# Structure is fixed at four paragraphs:
#   1. position + timing + one clause of why this firm
#   2. the proof paragraph — ONE asset, in operational detail
#   3. two supporting items, one sentence each
#   4. why this firm, citing something specific from the posting
#
# {anchor} is the only substitution filled from the job description. Everything
# else on this page is a fact or a sentence the owner has already approved.
# ---------------------------------------------------------------------------
letters:
  proof:
    quant:
      source: project:ohcamel
      lead: "The clearest thing I can point you to is a system I built myself."
      close: >-
        It is a small system. What it taught me is not OCaml, it is that a risk
        number is only as good as the argument for where it gets recomputed, and
        that argument is most of the work.
    allocator:
      source: experience:0
      lines: [0, 1, 2]
      lead: >-
        For the past stretch I have been the person faculty and graduate
        researchers come to when their data does not agree with itself.
      close: >-
        Manager research runs on the same instinct. A return series is worth what
        its conventions are worth, and someone has to be willing to go find out
        what they are before the number gets used.
    banking:
      source: experience:0
      lines: [0, 1]
      lead: >-
        Most of what I do now is take a question that is stated loosely and turn
        it into something a terminal can actually answer.
      close: >-
        I write BASIS on the same principle: a claim goes into the issue only
        once it is sourced, and a thesis that does not survive the fortnight gets
        said out loud rather than quietly dropped.
    corporate:
      source: experience:0
      lines: [0, 2]
      lead: >-
        The useful half of my job is not pulling the data. It is making sure the
        person who receives it can rerun it next quarter and trust what comes back.
      close: >-
        That is the whole of good reporting as far as I can tell: a number, the
        convention behind it, and a way for the reader to check both.

  # Paragraph 4. {anchor} is the specific platform, mandate, or structure the
  # posting names. Each sentence takes the anchor as a complement rather than a
  # subject, so it stays grammatical whether the anchor is "Aladdin Engineering",
  # "the long-term pool", or "Investment Committee".
  why_firm:
    quant: >-
      What I keep returning to in the posting is {anchor}. That is where the
      modelling decisions are load-bearing rather than decorative, and I would
      rather spend early years somewhere they are visible.
    allocator: >-
      The specific draw is {anchor}. An office that has to hold a view across
      managers and asset classes cannot outsource its judgement to a screen, and
      that is the kind of research I want to be doing.
    banking: >-
      The specific draw is {anchor}. Deal work rewards people who can hold a
      position long enough to defend it, and that is the habit I have been
      building.
    corporate: >-
      What made this posting stand out is {anchor}. Reporting work gets
      interesting exactly where someone has to decide what a number means before
      it goes out, and that decision sits inside this role.
  no_anchor: >-
    [[ NAME THE SPECIFIC PLATFORM, MANDATE, OR TEAM HERE -- the posting text did
    not give the generator anything concrete enough to quote ]]

  close: >-
    I would welcome the chance to talk. Thank you for your time and consideration.
  signoff: Sincerely,
