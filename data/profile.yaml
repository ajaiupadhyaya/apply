projects:
  ohcamel:
    name: OhCamel
    url: https://github.com/ajaiupadhyaya/OhCamel
    tracks: [quant]
    # one_line, three_line and technical are descriptions for the writer to
    # draw on. resume_line is printed verbatim on the resume.
    one_line: "OhCamel is a reactive risk and limits engine written in OCaml."
    resume_line: >-
      Reactive risk and limits engine on an incremental computation framework;
      recomputes exposure and limit breaches only along the dependency paths a
      tick touches, rather than re-running the full book.
    stack: [OCaml, Incremental]
    three_line: |
      OhCamel is a reactive risk and limits engine written in OCaml on an incremental
      computation framework. It recomputes exposure and limit breaches only along
      the dependency paths a tick actually touches, rather than re-running the
      full book on every update.
    technical: |
      The engine models a book as a dependency graph of incremental nodes:
      positions feed exposures, exposures feed limit checks, limit checks feed a
      breach set. A price or position update invalidates only the nodes
      downstream of it, so the cost of a tick scales with what changed rather
      than with the size of the book. The design problems that mattered were
      deciding where to cut the graph so recomputation stays cheap without
      making the model dishonest, keeping the breach set consistent when several
      inputs move in the same tick, and writing the whole thing so that the
      stated risk number and the computed one cannot drift apart silently.
  compute_index:
    name: GPU Compute Price Index
    tracks: [quant, allocator]
    one_line: "The GPU Compute Price Index is an independent price index for
      GPU compute rental markets, built because quoted rates are not comparable
      across providers."
    resume_line: >-
      Independent price index for GPU compute rental markets; normalises listings
      that differ in hardware, commitment term, interconnect, and egress onto one
      reference unit.
    three_line: |
      The index is an independent price on GPU compute rental markets, built because
      quoted rates are fragmented across providers and not directly comparable.
      It normalises heterogeneous listings into a series you can actually take a
      basis against.
    technical: |
      The hard part is not collection, it is comparability: providers quote
      different hardware, commitment terms, interconnect, and egress, so a
      headline hourly rate is not a price of the same thing. The index defines a
      reference unit, maps listings onto it, and keeps each adjustment explicit,
      so a reader can disagree with a specific assumption rather than with the
      whole series.
  basis:
    name: BASIS
    tracks: [quant, banking, allocator, corporate]
    one_line: "BASIS is the biweekly research report I write on finance,
      economics, and technology."
    resume_line: >-
      Biweekly research report on finance, economics, and technology, written to
      a standing deadline; every claim sourced before the issue ships.
    three_line: |
      BASIS is a biweekly research report on finance, economics, and technology,
      written to a standing deadline. Each issue takes a question, works it out against
      primary sources, and states what the evidence does and does not support.
    technical: |
      Writing to a fixed cadence enforces a discipline that ad hoc research does
      not: every claim has to be sourced before the issue ships, and a thesis
      that does not survive the fortnight has to be said out loud rather than
      quietly dropped.

