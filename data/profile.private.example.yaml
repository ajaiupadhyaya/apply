# Copy to data/profile.private.yaml and fill in. That file is gitignored.
#
# It holds the facts that should not be public, and the strategy that should
# not be either: where you are applying, what you are looking for, and what you
# are willing to spend. Never add SSN, date of birth, government ID or bank
# details here or anywhere else in this repo.

identity:
  phone: ASK                    # e.g. "+1 555 555 0123"
  street_address: ASK           # e.g. "123 Main St, City, ST 00000"

education_private:
  gpa: ASK                      # e.g. "3.80"

# How the relevance gate behaves.
search:
  thresholds:
    pursue: 70                  # write the letter automatically
    maybe: 45                   # file it and show it to me
  max_auto_per_day: 5           # ceiling on letters written per unattended run

# Ceilings on model spending. Discovery and scoring are free; these govern
# letter writing and auditing only.
budget:
  monthly_usd: 15.00
  per_run_usd: 2.00
  per_call_usd: 0.50

# Optional: a push to your phone when a run needs you. Pick a long random
# topic name — anyone who knows it can read the notifications.
# notify:
#   ntfy_topic: apply-<long-random-string>

# Your target list. Strategy, so it lives here and not in the public profile.
targets:
  firms:
    - Example Capital
    - Another Firm
  grad_programs:
    - Example MSc in Finance
